<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Nachrichten & Live-Events der Familie Gödecke</title>
  <meta name="description" content="Tagesbriefing mit Politik, Wirtschaft, Technik, Regionalem, Live-Events aus Mingerode, Duderstadt & Göttingen sowie Wetter." />

  <script src="https://tailwindcss.com"></script>
  <script src="https://unpkg.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Segoe UI', 'sans-serif'],
            mono: ['JetBrains Mono', 'SFMono-Regular', 'Menlo', 'monospace']
          },
          boxShadow: {
            soft: '0 20px 50px rgba(15, 23, 42, 0.08)',
            floating: '0 18px 44px rgba(17, 24, 39, 0.12)'
          }
        }
      }
    };
  </script>

  <!-- Google Custom Search Engine Skript-Integration -->
  <script async src="https://cse.google.com/cse.js?cx=d0f9cf30cf251472d"></script>

  <style>
    :root {
      --bg: #f5f5f7;
      --surface: rgba(255,255,255,0.74);
      --surface-strong: rgba(255,255,255,0.92);
      --surface-dark: rgba(17,17,17,0.75);
      --line: rgba(15,23,42,0.08);
      --text: #111827;
      --muted: #667085;
      --blue: #0a84ff;
      --blue-strong: #0066d9;
    }

    html.dark {
      --bg: #000000;
      --surface: rgba(17,17,17,0.72);
      --surface-strong: rgba(28,28,30,0.85);
      --surface-dark: rgba(10,10,10,0.82);
      --line: rgba(255,255,255,0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --blue: #4ea1ff;
      --blue-strong: #7bb9ff;
    }

    html {
      background: var(--bg);
      color: var(--text);
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(10,132,255,0.08), transparent 25%),
        radial-gradient(circle at top right, rgba(107,114,128,0.06), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    }

    .glass {
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    html.dark .glass {
      background: rgba(17,17,17,0.68);
      border-color: rgba(255,255,255,0.08);
    }

    .card-hover {
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .card-hover:hover {
      transform: translateY(-4px); 
      box-shadow: 0 20px 30px rgba(15, 23, 42, 0.08);
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.92); }
    }

    .marquee {
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .marquee-track {
      display: inline-flex;
      width: max-content;
      animation: marquee 45s linear infinite;
    }

    @keyframes marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .content-fade {
      animation: fadeIn .4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .weather-tile {
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(148,163,184,0.12);
    }

    html.dark .weather-tile {
      background: rgba(15,23,42,0.4);
      border-color: rgba(148,163,184,0.12);
    }

    .article-card img {
      transition: transform 0.5s ease;
    }

    .article-card:hover img {
      transform: scale(1.04);
    }

    .tagesschau-video {
      overflow: visible;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(255,255,255,0.62);
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
    }

    html.dark .tagesschau-video {
      background: rgba(15, 23, 42, 0.6);
      border-color: rgba(255,255,255,0.08);
    }

    .tagesschau-video iframe {
      display: block;
      width: 100%;
      height: clamp(480px, 64vh, 820px);
      min-height: 480px;
      border: 0;
      background: #000;
      border-radius: 1rem;
    }

    @media (max-width: 640px) {
      .tagesschau-video iframe {
        height: clamp(520px, 76vh, 760px);
        min-height: 520px;
      }
    }

    /* Integration der Google CSE Design-Korrekturen */
    .gsc-control-cse {
      background-color: transparent !important;
      border: none !important;
      padding: 0 !important;
    }
    .gsc-search-box-tools .gsc-search-box .gsc-input {
      padding-right: 0 !important;
    }
  </style>
</head>
<body class="antialiased selection:bg-blue-500 selection:text-white">
  <header class="sticky top-0 z-50 border-b border-slate-200/60 dark:border-white/10 bg-white/70 dark:bg-black/70 backdrop-blur-xl">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center justify-between gap-4">
        <div class="flex items-center gap-3 min-w-0">
          <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 text-white shadow-lg shadow-blue-500/20">

          </div>
          <div class="min-w-0">
            <div class="text-[10px] font-semibold uppercase tracking-[0.28em] text-blue-600 dark:text-blue-300">Agent Intelligence</div>

          </div>
        </div>

        <div class="hidden items-center gap-2 md:flex">
          <button type="button" data-nav="politik" class="rounded-full border border-slate-200 bg-white/80 px-3 py-2 text-xs font-medium text-slate-700 shadow-sm transition hover:-translate-y-0.5 hover:border-slate-300 dark:border-white/10 dark:bg-slate-900/80 dark:text-slate-200">Politik</button>
          <button type="button" data-nav="wirtschaft" class="rounded-full border border-slate-200 bg-white/80 px-3 py-2 text-xs font-medium text-slate-700 shadow-sm transition hover:-translate-y-0.5 hover:border-slate-300 dark:border-white/10 dark:bg-slate-900/80 dark:text-slate-200">Wirtschaft</button>
          <button type="button" data-nav="technik" class="rounded-full border border-slate-200 bg-white/80 px-3 py-2 text-xs font-medium text-slate-700 shadow-sm transition hover:-translate-y-0.5 hover:border-slate-300 dark:border-white/10 dark:bg-slate-900/80 dark:text-slate-200">Technik</button>
          <button type="button" data-nav="regional" class="rounded-full border border-slate-200 bg-white/80 px-3 py-2 text-xs font-medium text-slate-700 shadow-sm transition hover:-translate-y-0.5 hover:border-slate-300 dark:border-white/10 dark:bg-slate-900/80 dark:text-slate-200">Regional</button>
          <button type="button" data-nav="events" class="rounded-full border border-slate-200 bg-white/80 px-3 py-2 text-xs font-medium text-slate-700 shadow-sm transition hover:-translate-y-0.5 hover:border-slate-300 dark:border-white/10 dark:bg-slate-900/80 dark:text-slate-200">Events</button>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
          <button id="themeToggle" type="button" class="flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 bg-white/80 text-slate-600 transition hover:-translate-y-0.5 hover:border-slate-300 dark:border-white/10 dark:bg-slate-900/80 dark:text-slate-200">
            <i data-lucide="moon" class="h-4 w-4" id="themeIcon"></i>
          </button>
          <button id="ttsBtn" type="button" aria-label="Tagesschau Podcast öffnen" class="flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 bg-white/80 text-slate-600 transition hover:-translate-y-0.5 hover:border-slate-300 dark:border-white/10 dark:bg-slate-900/80 dark:text-slate-200">
            <i data-lucide="headphones" class="h-4 w-4" id="ttsIcon"></i>
          </button>
          <button type="button" onclick="shareViaWhatsApp()" class="flex items-center">
            <i data-lucide="share-2" class="h-4 w-4"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Hauptinhalt der Website -->
  <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Hier befindet sich dein restlicher Content (Nachrichten, etc.) -->
    <section class="mb-12">
      <!-- Platzhalter für deine News-Karten -->
    </section>

    <!-- Eventkalender-Sektion ganz unten -->
    <section class="content-fade mt-16" id="events-section">
      <div class="glass rounded-3xl p-6 md:p-8 shadow-soft border border-slate-200/50 dark:border-white/5">
        
        <!-- Sektions-Header -->
        <div class="flex items-center gap-3 mb-6">
          <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 text-white shadow-lg shadow-indigo-500/20">
            <i data-lucide="calendar-days" class="h-5 w-5"></i>
          </div>
          <div>
            <h2 class="text-sm font-semibold tracking-wide uppercase text-indigo-600 dark:text-indigo-400">Live-Events & Kalender</h2>
            <p class="text-xs text-slate-500 dark:text-muted">Finde heraus, was in der Region passiert</p>
          </div>
        </div>

        <!-- Kalender-Inhaltsbereich -->
        <div class="grid gap-6 lg:grid-cols-3">
