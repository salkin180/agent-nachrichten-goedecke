<body class="bg-apple-bg dark:bg-apple-darkBg text-[#1d1d1f] dark:text-[#f5f5f7] font-sans antialiased selection:bg-apple-blue selection:text-white pb-36 transition-colors duration-300">

  <header class="sticky top-0 z-50 apple-glass bg-white/70 dark:bg-black/75 border-b border-apple-borderLight dark:border-apple-borderDark transition-colors">

        <div>

        <button onclick="shareViaWhatsApp()" class="flex items-center space-x-2 bg-[#25D366] hover:bg-[#20ba5a] text-white px-3.5 py-1.5 rounded-full text-xs font-medium transition shadow-sm" title="Per WhatsApp teilen">

        <button id="ttsBtn" onclick="toggleSpeech()" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-apple-subtle hover:text-[#1d1d1f] dark:hover:text-white transition" title="Vorlesen">
          <i data-lucide="volume-2" id="ttsIcon" class="w-5 h-5"></i>

        <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-apple-subtle hover:text-[#1d1d1f] dark:hover:text-white transition" title="Design wechseln">

  <section class="max-w-6xl mx-auto px-4 sm:px-6 pt-10 pb-6">

        <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-apple-blue/10 text-apple-blue text-xs font-semibold tracking-wide mb-3">
          <span class="w-2 h-2 rounded-full bg-apple-blue animate-pulse"></span>

          Tagesbriefing.<br><span class="text-apple-subtle font-medium">Präzise. Tiefgründig. Lokal.</span>
        </h1>
      </div>

      <div class="w-full max-w-sm rounded-3xl border border-apple-borderLight dark:border-apple-borderDark bg-white/80 dark:bg-[#1c1c1e]/80 p-3 shadow-sm">
        <div class="flex items-center justify-between gap-3">
          <div>
            <div class="text-[10px] uppercase tracking-[0.2em] text-apple-subtle font-semibold">Wetter in Duderstadt</div>
            <div id="weatherTemp" class="text-2xl font-bold mt-1">--°C</div>
          </div>

      <button onclick="filterCategory('wirtschaft')" class="cat-pill px-4 py-2 rounded-full text-xs font-medium transition bg-white dark:bg-[#1c1c1e] text-apple-subtle hover:text-[#1d1d1f] dark:hover:text-white border border-apple-borderLight dark:border-apple-borderDark" data-cat="wirtschaft">Wirtschaft</button>
      <button onclick="filterCategory('technik')" class="cat-pill px-4 py-2 rounded-full text-xs font-medium transition bg-white dark:bg-[#1c1c1e] text-apple-subtle hover:text-[#1d1d1f] dark:hover:text-white border border-apple-borderLight dark:border-apple-borderDark" data-cat="technik">Technik</button>
      <button onclick="filterCategory('regional')" class="cat-pill px-4 py-2 rounded-full text-xs font-medium transition bg-white dark:bg-[#1c1c1e] text-apple-subtle hover:text-[#1d1d1f] dark:hover:text-white border border-apple-borderLight dark:border-apple-borderDark" data-cat="regional">Regional</button>
      <button onclick="filterCategory('events')" class="cat-pill px-4 py-2 rounded-full text-xs font-medium transition bg-white dark:bg-[#1c1c1e] text-apple-subtle hover:text-[#1d1d1f] dark:hover:text-white border border-apple-borderLight dark:border-apple-borderDark" data-cat="events">Events</button>
    </div>
  </section>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 mt-6">
    <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <section id="eventsSection" class="mt-16 space-y-6">
      <div class="flex items-center space-x-3 pb-3 border-b border-apple-borderLight dark:border-apple-borderDark">
        <div class="w-8 h-8 rounded-xl bg-purple-500/10 text-purple-600 dark:text-purple-400 flex items-center justify-center font-bold text-sm">
          <i data-lucide="calendar" class="w-4 h-4"></i>
        </div>
        <div>
          <h2 class="text-2xl font-bold tracking-tight">Wochenend-Events: Duderstadt, Mingerode & Göttingen</h2>
          <p id="eventRange" class="text-xs text-apple-subtle">Termine für das aktuelle Wochenende</p>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="eventsGrid"></div>
    </section>

  <div id="articleModal" class="fixed inset-0 z-50 hidden bg-black/60 apple-glass flex items-center justify-center p-4">

        <img id="modalImg" src="" alt="" class="w-full h-full object-cover">

        </button>
        <span id="modalBadge" class="absolute bottom-4 left-4 px-3 py-1 rounded-full text-xs font-semibold bg-white/90 text-black apple-glass"></span>

        <div class="flex items-center justify-between text-xs text-apple-subtle font-mono">

          <span id="modalDate"></span>
        </div>
        <h2 id="modalTitle" class="text-2xl font-bold tracking-tight text-[#1d1d1f] dark:text-white"></h2>
        <div id="modalContent" class="text-base text-apple-subtle leading-relaxed space-y-3"></div>
        <div class="pt-4 border-t border-apple-borderLight dark:border-apple-borderDark flex items-center justify-between">
          <a id="modalLink" href="#" target="_blank" class="inline-flex items-center space-x-2 text-sm font-semibold text-apple-blue hover:text-apple-blueHover">
            <span>Originalquelle öffnen</span>
            <i data-lucide="external-link" class="w-4 h-4"></i>
          </a>
          <button onclick="closeModal()" class="px-5 py-2 rounded-full text-xs font-semibold bg-apple-bg dark:bg-black/40 hover:bg-black/10 transition">Schließen</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const NEWS_DATABASE = [
      { id: 1, cat: 'politik', badge: 'Top 1 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'Spanisches Zugunglück bei Toledo: Ermittler sichern Zugsicherung und Funkdaten', summary: 'Nach dem schweren Zugunglück in Spanien konzentrieren sich die Ermittlungen auf die Sicherungssysteme, Funkdaten und die Aussage von Fahrpersonal und Rettungskräften.', fullText: 'Die Staatsanwaltschaft in Toledo hat nach dem Zugunglück weitere Funkdaten und Aufzeichnungen der Leitstelle sichergestellt. Nach Angaben der Ermittler gibt es bislang keine Hinweise auf ein gezieltes Handeln, aber die Frage der technischen Ursachen bleibt im Fokus. Sicherheitsbehörden prüfen nun die Spurweite, die Handlungsfähigkeit des Lokpersonals und die Reaktion der Infrastruktur auf die Störung. Parallel laufen die Befragungen von Zeugen und die Auswertung von Videoaufnahmen aus der Umgebung.', img: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 2, cat: 'politik', badge: 'Top 2 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'Kabinett bringt „Gebäudetyp E“ auf den Weg: Günstigeres Bauen', summary: 'Bundesregierung will mit einem neuen Gebäudetyp den Wohnungsbau erleichtern und die Kosten für energieeffiziente Häuser senken.', fullText: 'Das Bundeskabinett hat die Einführung eines neuen Gebäudetypen-Konzepts beschlossen, der eine Vereinfachung für Wohnungsbauprojekte verspricht. Der Entwurf von „Gebäudetyp E“ soll insbesondere kleine und mittlere Bauherren entlasten, indem er Standardisierungen und vereinfachte Nachweise einführt. Die Koalition zeigt sich optimistisch, dass dadurch die Baukosten sinken und die Lieferzeiten im Wohnungsbau reduziert werden. Kritiker merken an, dass die neue Regelung nicht alle Wohnformen abdecke und eine lückenlose Umsetzung im Detail noch unklar sei.', img: 'https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 3, cat: 'politik', badge: 'Top 3 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'Haushalt 2027: Chefhaushälter gehen in Klausur', summary: 'Vor der Bereinigungssitzung bleibt die Frage offen, wo im Bundeshaushalt 2027 die Prioritäten gesetzt werden.', fullText: 'Die Chefhaushälter der Bundesregierung sind am Vorabend der Abschlussrunde zu Beratungen zusammengekommen. Dabei steht vor allem die Bereinigung von Sparvorschlägen, Investitionsprioritäten und der Haushaltsrahmen für Verteidigung, Innenpolitik und Infrastruktur im Fokus. Unter Ökonomen wird darüber spekuliert, ob der Staat im Jahr 2027 stärker in digitale Infrastruktur und Energieprojekte investieren will. Die Beschlüsse sollen im Lauf der Woche weiter konkretisiert werden.', img: 'https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 4, cat: 'politik', badge: 'Top 4 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'Kanzlerreise: Halbleiter- und Rohstoffallianzen in Tokio und Seoul', summary: 'Bundeskanzler will in Ostasien neue Kooperationen für Technik, Rohstoffe und Versorgungssicherheit verankern.', fullText: 'Im Rahmen einer Reise nach Tokio und Seoul will die Bundesregierung neue strategische Partnerschaften mit Japan und Südkorea ausbauen. Im Mittelpunkt stehen die Sicherung von Lieferketten, der Austausch in der Halbleiterproduktion und die Kooperation bei kritischen Rohstoffen. Beobachter sehen darin eine Reaktion auf die geopolitischen Spannungen und die gestiegene Abhängigkeit von Einzelregionen. Die Gespräche erfolgen unter dem Motto, Versorgungssicherheit und nachhaltige Zusammenarbeit künftig enger zu verbinden.', img: 'https://images.unsplash.com/photo-1518546305927-5a555bb7020d?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 5, cat: 'politik', badge: 'Top 5 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'Knesset-Wahlergebnis: Zersplitterung erschwert Koalitionsbildung', summary: 'Nach der Wahl in Israel zeigt sich die politische Lage extrem fragmentiert und erschwert eine stabile Regierung.', fullText: 'Die jüngste Parlamentswahl in Israel hat erneut zu einer starken Zersplitterung geführt. Mehrere kleinere Parteien erzielen hohe Stimmenanteile, was die Bildung einer Koalition deutlich erschwert. Die Herausforderung besteht nicht nur in der politischen Programmierung, sondern auch in der Bereitschaft zu Zugeständnissen zwischen den Lagerfronten. Analysten warnen vor längeren Verhandlungen und einer bestehenden Instabilität in der Sicherheits- und Wirtschaftspolitik.', img: 'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 6, cat: 'politik', badge: 'Top 6 Politik', date: '30.10.2026', source: 'NDR', title: 'Parteispendenaffäre: Rechtsausschuss fordert Konsequenzen', summary: 'Der niedersächsische Landtag will in der Parteispendenaffäre die Verantwortlichen klarer benennen und mögliche Konsequenzen prüfen.', fullText: 'Ein Landtagsausschuss hat nach den jüngsten Vorwürfen gegen Spendenpraktiken im Land die Vorlage von Nachweisen und Erklärungen gefordert. Die Debatte betrifft sowohl die Transparenz von Partei- und Lobbybeziehungen als auch die Frage nach gesetzesmäßigen Grenzen. Kritiker fordern ein schnellstmögliches Verfahren und klare Sanktionen, wenn die Regeln verletzt wurden. Die politischen Akteure sehen sich zugleich mit der Herausforderung konfrontiert, politische Entscheidungen und Spendenvorgänge sauber zu trennen.', img: 'https://images.unsplash.com/photo-1495020689067-958852a7765e?auto=format&fit=crop&w=1200&q=80', url: 'https://www.ndr.de/' },
      { id: 7, cat: 'politik', badge: 'Top 7 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'Maritime Sicherheitsoperation im Persischen Golf', summary: 'Begleitfregatten und Aufklärungsflugzeuge verstärken die Sicherheitslage im strategisch wichtigen Seegebiet.', fullText: 'Militärische Begleitschutzmaßnahmen werden im Persischen Golf verstärkt, nachdem regionale Spannungen und Sicherheitsrisiken zugenommen haben. Die betroffenen Staaten kooperieren mit internationalen Partnern, um den Schutz von Schifffahrtswegen zu stärken. Die Lage wird von Beobachtern als Teil einer größeren Sicherheitsstrategie in einer instabilen Region beschrieben. Die Diskussion zeigt zugleich die Bedeutung der Seewege für Energieversorgung und globale Lieferketten.', img: 'https://images.unsplash.com/photo-1578575437130-527eed3abbec?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 8, cat: 'politik', badge: 'Top 8 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'Ukraine-Winterhilfe: Europäische Hochspannungstransformatoren geliefert', summary: 'Mit der Lieferung weiterer Transformatoren steigt der Druck auf das ukrainische Energieversorgungssystem.', fullText: 'Europäische Verbündete liefern der Ukraine neue Transformatoren, die das kritische Stromnetz vor dem Winter stabilisieren sollen. Die Maßnahmen sind Teil einer breiteren Hilfe, um Blackouts und Stromausfälle in der Winterperiode zu vermeiden. Fachleute betonen, dass die Versorgungslage trotz der Hilfe weiterhin prekär bleibt, da die Infrastruktur teilweise schwer beschädigt ist. Die Unterstützung unterstreicht zugleich die langfristige europäische Sicherheitsstrategie gegenüber Russland.', img: 'https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 9, cat: 'politik', badge: 'Top 9 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'Innenminister fordern Fortführung stationärer Grenzkontrollen', summary: 'Bundesländer wollen die bestehenden Grenzkontrollen wegen Sicherheitsrisiken und Migrationslage verlängern.', fullText: 'Die Innenminister der Länder sprechen sich dafür aus, die auslaufenden stationären Grenzkontrollen zu verlängern. Nach Einschätzung der Behörden bleiben die Sicherheitsrisiken und die Migrationslage für die deutsche Grenzlage weiterhin hoch. Die Debatte fällt in eine Phase, in der die Bundesregierung eine neue Lagebeurteilung erwartet. Kritiker warnen, dass eine dauerhafte Ausweitung ein Gegengewicht zu ökonomischer Flexibilität und Europäisierung darstellen kann.', img: 'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 10, cat: 'politik', badge: 'Top 10 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'EU-Fahrgastrechte: Automatische Entschädigung bei Zugverspätungen', summary: 'Neue EU-Vorschriften erleichtern Reisenden die Durchsetzung von Ansprüchen bei stark verspäteten Zügen.', fullText: 'Mit neuen EU-Regelungen sollen Fahrgäste bei Zugverspätungen automatisch entschädigt werden, wenn die Verspätung die festgelegten Grenzen überschreitet. Die Brüsseler Vorgaben würden Reisenden im Schienenverkehr deutlich mehr Schutz bieten und Verfahren vereinfachen. Die deutsche Bundesregierung prüft die Umsetzung und mögliche Folgen für Netzbetreiber und Bahnunternehmen. Der Vorschlag ist ein weiterer Hinweis auf die europäische Agenda zur Mobilität und Kundenzufriedenheit.', img: 'https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 11, cat: 'wirtschaft', badge: 'Top 1 Wirtschaft', date: '30.10.2026', source: 'Tagesschau', title: 'ifo-Geschäftsklima steigt den sechsten Monat in Folge', summary: 'Das Barometer klettert erneut, trotz anhaltender Unsicherheiten in der Industrie und im Bau.', fullText: 'Das ifo-Geschäftsklima ist im Oktober erneut gestiegen und notiert nun auf einem Niveau, das die wirtschaftliche Stabilisierung signalisiert. Die Unternehmen blicken insgesamt positiver auf die Geschäftslage, auch wenn die Stimmung in einzelnen Branchen differenziert bleibt. Der Anstieg wird zum Teil auf eine bessere Lage bei der Auslastung und eine veränderte Nachfrage nach Investitionsgütern zurückgeführt. Ökonomen erwarten, dass sich die Erholung noch weiter im Laufe des Jahres fortsetzen kann.', img: 'https://images.unsplash.com/photo-1559526324-4b87b5e36e44?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 12, cat: 'wirtschaft', badge: 'Top 2 Wirtschaft', date: '30.10.2026', source: 'Tagesschau', title: 'Industrie fordert Senkung der Stromsteuer für alle Betriebe', summary: 'Verbände verhandeln mit der Politik über günstigere Produktionsbedingungen und weniger Energiebelastung.', fullText: 'Die deutsche Industrie drängt auf eine umfassende Senkung der Stromsteuer, um die Wettbewerbsfähigkeit zu stärken. Der Vorschlag umfasst insbesondere KMU und energieintensive Branchen, die durch hohe Energiekosten belastet werden. Die Wirtschaft verweist auf internationale Konkurrenzländer, die bereits Niedrigpreismodelle und Subventionen für Energiekosten anbieten. Die Debatte wird als Teil einer breiteren Steuer- und Energiepolitik gesehen, die zugleich Umweltziele und Standortvorteile ausgleichen muss.', img: 'https://images.unsplash.com/photo-1494412651409-8963ce7935a7?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 13, cat: 'wirtschaft', badge: 'Top 3 Wirtschaft', date: '30.10.2026', source: 'Tagesschau', title: 'Regionalisierungsmittel: Länder warnen vor ÖPNV-Kürzungen', summary: 'Verkehrsminister warnen vor Konsequenzen für ländliche Regionen, wenn die Fördermittel gekürzt werden.', fullText: 'Die Länder haben erneut davor gewarnt, dass Kürzungen bei den Regionalisierungsmitteln unmittelbare Folgen für den öffentlichen Verkehr in ländlichen Regionen hätten. Zugstreichungen, weniger Verbindungen und höhere Fahrpreise wären die Folge. Die Debatte kommt in einer Phase, in der der Ausbau des öffentlichen Verkehrs für Klimaschutz und regionale Entwicklung als zentrales Thema gilt. Beobachter sprechen von der Notwendigkeit, Ausgleichsmaßnahmen für schwächere Regionen zu schaffen.', img: 'https://images.unsplash.com/photo-1517638851339-a711cfcf3279?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 14, cat: 'wirtschaft', badge: 'Top 4 Wirtschaft', date: '30.10.2026', source: 'Tagesschau', title: 'Automobilzulieferer beschleunigen Standortkonsolidierung', summary: 'Höhere Energiepreise und Wandel im Fahrzeugbereich treiben die Strukturveränderungen voran.', fullText: 'Automobilzulieferer reagieren auf den Wandel in der Fahrzeugproduktion mit einer beschleunigten Standortkonsolidierung. Die Unternehmen verlagern Kapazitäten, schließen unrentable Werke und erhöhen die Automatisierung. Die Lage wird als Antwort auf technologischen Wandel, wachsende Anforderungen an Elektrik/Elektronik und Energiepreise interpretiert. Die Debatte zeigt, wie stark die Transformation der Autoindustrie bereits in den Regionen spürbar ist.', img: 'https://images.unsplash.com/photo-1489824904134-891ab64532f1?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },

    function formatDayDate(date = new Date()) {
      return new Intl.DateTimeFormat('de-DE', {
        weekday: 'long',
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      }).format(date);
    }

    function formatDateTime(date = new Date()) {
      return `${new Intl.DateTimeFormat('de-DE', {
        weekday: 'long'
      }).format(date)}, ${new Intl.DateTimeFormat('de-DE', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      }).format(date)} • ${new Intl.DateTimeFormat('de-DE', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(date)} Uhr`;
    }

    function updateCurrentDateUI() {
      const now = new Date();
      const label = document.getElementById('liveDateLabel');
      if (label) {
        label.textContent = formatDateTime(now);
      }
      document.title = `Agent Nachrichten der Familie Gödecke – ${formatDayDate(now)}`;
    }

    function getWeatherIcon(code) {
      const map = {
        0: '☀️', 1: '⛅', 2: '⛅', 3: '☁️', 45: '🌫️', 48: '🌫️',
        51: '🌦️', 53: '🌦️', 55: '🌦️', 56: '🌧️', 57: '🌧️',
        61: '🌧️', 63: '🌧️', 65: '🌧️', 66: '🌧️', 67: '🌧️',
        71: '❄️', 73: '❄️', 75: '❄️', 77: '❄️', 80: '🌦️', 81: '🌧️', 82: '🌧️',
        85: '❄️', 86: '❄️', 95: '⛈️', 96: '⛈️', 99: '⛈️'
      };
      return map[code] || '☀️';
    }

    async function loadWeather() {
      const tempEl = document.getElementById('weatherTemp');
      const metaEl = document.getElementById('weatherMeta');
      const iconEl = document.getElementById('weatherIcon');
      if (!tempEl || !metaEl || !iconEl) return;

      try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=51.5124&longitude=9.6724&current=temperature_2m,weather_code,wind_speed_10m&timezone=Europe%2FBerlin';
        const response = await fetch(url);
        if (!response.ok) throw new Error('Weather request failed');
        const data = await response.json();
        const current = data.current;
        const temp = Math.round(current.temperature_2m);
        const wind = Math.round(current.wind_speed_10m);
        const code = current.weather_code;

        tempEl.textContent = `${temp}°C`;
        iconEl.textContent = getWeatherIcon(code);
        metaEl.textContent = `Wind ${wind} km/h • ${new Intl.DateTimeFormat('de-DE', { hour: '2-digit', minute: '2-digit' }).format(new Date())}`;
      } catch (error) {
        tempEl.textContent = '--°C';
        iconEl.textContent = '☁️';
        metaEl.textContent = 'Wetterdaten aktuell nicht verfügbar';
      }
    }

    function updateEventRangeText() {
      const eventRange = document.getElementById('eventRange');
      if (!eventRange) return;
      const today = new Date();
      const weekday = today.getDay();
      const daysUntilSaturday = (6 - weekday + 7) % 7 || 7;
      const saturday = new Date(today);
      saturday.setDate(today.getDate() + daysUntilSaturday);
      const sunday = new Date(saturday);
      sunday.setDate(saturday.getDate() + 1);
      const formatter = new Intl.DateTimeFormat('de-DE', { day: '2-digit', month: '2-digit' });
      eventRange.textContent = `Termine vom ${formatter.format(saturday)} bis ${formatter.format(sunday)}`;
    }

    function renderNews() {

          <div>
            <div class="h-48 w-full overflow-hidden bg-black/10 relative">
              <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
              <span class="absolute top-3 left-3 px-3 py-1 rounded-full text-[10px] font-bold tracking-wider uppercase apple-glass bg-white/80 dark:bg-black/70 text-[#1d1d1f] dark:text-white shadow-sm">${item.badge}</span>
            </div>
            <div class="p-5">
              <div class="flex items-center justify-between text-xs text-apple-subtle font-mono mb-2">
                <span>${item.source}</span>
                <span>${item.date}</span>
              </div>
              <h3 class="text-base font-bold tracking-tight text-[#1d1d1f] dark:text-white mb-2 leading-snug group-hover:text-apple-blue transition">${item.title}</h3>
              <p class="text-xs text-apple-subtle leading-relaxed line-clamp-3">${item.summary}</p>
            </div>
          </div>
          <div class="px-5 pb-5 pt-2 flex items-center justify-between border-t border-apple-borderLight dark:border-apple-borderDark mt-auto">
            <span class="text-xs font-semibold text-apple-blue flex items-center space-x-1">
              <span>Vollständig lesen</span>

            </span>

              <i data-lucide="external-link" class="w-4 h-4"></i>
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
      lucide.createIcons();
    }

    function renderEvents() {
      const grid = document.getElementById('eventsGrid');
      grid.innerHTML = '';
      EVENTS_DATABASE.forEach(evt => {
        const card = document.createElement('article');
        card.className = 'bg-apple-card dark:bg-apple-darkCard apple-glass rounded-3xl border border-apple-borderLight dark:border-apple-borderDark overflow-hidden flex flex-col justify-between hover:shadow-xl transition-shadow duration-300';
        card.innerHTML = `
          <div>
            <div class="h-40 w-full overflow-hidden bg-black/10 relative">
              <img src="${evt.img}" alt="${evt.title}" class="w-full h-full object-cover" loading="lazy">
              <span class="absolute top-3 left-3 px-3 py-1 rounded-full text-[10px] font-bold tracking-wider uppercase apple-glass bg-purple-600/90 text-white shadow-sm">${evt.badge}</span>
            </div>
            <div class="p-5">
              <h3 class="text-base font-bold tracking-tight text-[#1d1d1f] dark:text-white mb-2 leading-snug">${evt.title}</h3>
              <div class="space-y-1 mb-3 text-xs text-apple-subtle">
                <div class="flex items-center space-x-2"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-apple-blue"></i><span>${evt.location}</span></div>
                <div class="flex items-center space-x-2"><i data-lucide="clock" class="w-3.5 h-3.5 text-apple-blue"></i><span>${evt.time}</span></div>
              </div>
              <p class="text-xs text-apple-subtle leading-relaxed">${evt.desc}</p>
            </div>
          </div>
          <div class="px-5 pb-5 pt-2 border-t border-apple-borderLight dark:border-apple-borderDark">
            <a href="${evt.url}" target="_blank" class="inline-flex items-center space-x-1.5 text-xs font-semibold text-apple-blue hover:text-apple-blueHover">
              <span>Event-Details anzeigen</span>
              <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
      lucide.createIcons();
    }

    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = 'cat-pill px-4 py-2 rounded-full text-xs font-medium transition bg-apple-blue text-white shadow-sm';
        } else {
          btn.className = 'cat-pill px-4 py-2 rounded-full text-xs font-medium transition bg-white dark:bg-[#1c1c1e] text-apple-subtle hover:text-[#1d1d1f] dark:hover:text-white border border-apple-borderLight dark:border-apple-borderDark';
        }
      });
      const eventsSec = document.getElementById('eventsSection');
      if (cat === 'events') {
        document.getElementById('newsGrid').classList.add('hidden');
        eventsSec.scrollIntoView({ behavior: 'smooth' });
      } else {
        document.getElementById('newsGrid').classList.remove('hidden');
      }
      renderNews();
    }

    function handleSearch(q) {
      searchQuery = q.toLowerCase().trim();
      renderNews();
    }

    function openModal(item) {
      document.getElementById('modalImg').src = item.img;
      document.getElementById('modalBadge').innerText = item.badge;
      document.getElementById('modalSource').innerText = item.source;
      document.getElementById('modalDate').innerText = item.date;
      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalContent').innerHTML = `
        <p class="font-medium text-[#1d1d1f] dark:text-white mb-2">${item.summary}</p>
        <p class="text-sm leading-relaxed">${item.fullText}</p>
      `;
      document.getElementById('modalLink').href = item.url;
      document.getElementById('articleModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('articleModal').classList.add('hidden');
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      const themeIcon = document.getElementById('themeIcon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        themeIcon.setAttribute('data-lucide', 'moon');
      } else {
        html.classList.add('dark');
        themeIcon.setAttribute('data-lucide', 'sun');
      }
      lucide.createIcons();
    }

    let isSpeaking = false;
    function toggleSpeech() {
      const ttsIcon = document.getElementById('ttsIcon');
      if (!('speechSynthesis' in window)) {
        alert('Sprachausgabe wird nicht unterstützt.');
        return;
      }
      if (isSpeaking) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
        ttsIcon.setAttribute('data-lucide', 'volume-2');
        lucide.createIcons();
        return;
      }
      const textToRead = `Tägliche Zusammenfassung des heutigen Tages für Familie Gödecke. Top-Meldungen: Zugunglück bei Toledo, Kabinett verabschiedet Gebäudetyp E, ifo-Geschäftsklima steigt, BSI warnt vor Angriffen auf Web-Frameworks, lokale Veranstaltungen im Eichsfeld und in Göttingen. Wetter in Duderstadt heute: ${document.getElementById('weatherTemp')?.textContent || 'aktuell'}.`;
      const utterance = new SpeechSynthesisUtterance(textToRead);
      utterance.lang = 'de-DE';
      utterance.onend = () => {
        isSpeaking = false;
        ttsIcon.setAttribute('data-lucide', 'volume-2');
        lucide.createIcons();
      };
      window.speechSynthesis.speak(utterance);
      isSpeaking = true;
      ttsIcon.setAttribute('data-lucide', 'square');
      lucide.createIcons();
    }
