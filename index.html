<!DOCTYPE html>

<head>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'system-ui', 'sans-serif'],
            mono: ['"SF Mono"', 'Menlo', 'monospace']
          },
          colors: {
            apple: {
              bg: '#f5f5f7',
              darkBg: '#000000',
              card: 'rgba(255, 255, 255, 0.85)',
              darkCard: 'rgba(28, 28, 30, 0.8)',
              blue: '#0071e3',
              blueHover: '#0077ed',
              subtle: '#86868b',
              borderLight: 'rgba(0, 0, 0, 0.08)',
              borderDark: 'rgba(255, 255, 255, 0.12)'
            }
          }
        }
      }
    }
  </script>
  <style>
    .apple-glass {
      backdrop-filter: blur(24px);

<body class="bg-apple-bg dark:bg-apple-darkBg text-[#1d1d1f] dark:text-[#f5f5f7] font-sans antialiased selection:bg-apple-blue selection:text-white pb-36 transition-colors duration-300">

  <header class="sticky top-0 z-50 apple-glass bg-white/70 dark:bg-black/75 border-b border-apple-borderLight dark:border-apple-borderDark transition-colors">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-2xl bg-apple-blue text-white flex items-center justify-center shadow-sm">
          <i data-lucide="newspaper" class="w-5 h-5"></i>
        </div>
        <div>
          <span class="text-[10px] font-bold tracking-widest uppercase text-apple-blue block leading-tight">Agent Intelligence</span>
          <span class="text-base font-semibold tracking-tight">Nachrichten Familie Gödecke</span>
        </div>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-3">
        <button onclick="shareViaWhatsApp()" class="flex items-center space-x-2 bg-[#25D366] hover:bg-[#20ba5a] text-white px-3.5 py-1.5 rounded-full text-xs font-medium transition shadow-sm" title="Per WhatsApp teilen">
          <i data-lucide="share-2" class="w-4 h-4"></i>
          <span class="hidden md:inline">Per WhatsApp teilen</span>
        </button>

        <button id="ttsBtn" onclick="toggleSpeech()" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-apple-subtle hover:text-[#1d1d1f] dark:hover:text-white transition" title="Vorlesen">
          <i data-lucide="volume-2" id="ttsIcon" class="w-5 h-5"></i>
        </button>
        <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-apple-subtle hover:text-[#1d1d1f] dark:hover:text-white transition" title="Design wechseln">
          <i data-lucide="moon" id="themeIcon" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </header>

  <section class="max-w-6xl mx-auto px-4 sm:px-6 pt-10 pb-6">
    <div class="flex flex-col xl:flex-row xl:items-end justify-between gap-6">
      <div class="max-w-2xl">
        <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-apple-blue/10 text-apple-blue text-xs font-semibold tracking-wide mb-3">
          <span class="w-2 h-2 rounded-full bg-apple-blue animate-pulse"></span>
          <span id="liveDateLabel">Lädt...</span>
        </div>
        <h1 class="text-3xl sm:text-5xl font-bold tracking-tight text-[#1d1d1f] dark:text-white leading-tight">
          Tagesbriefing.<br><span class="text-apple-subtle font-medium">Präzise. Tiefgründig. Lokal.</span>
        </h1>
      </div>

      <div class="w-full max-w-sm rounded-3xl border border-apple-borderLight dark:border-apple-borderDark bg-white/80 dark:bg-[#1c1c1e]/80 p-3 shadow-sm">
        <div class="flex items-center justify-between gap-3">
          <div>
            <div class="text-[10px] uppercase tracking-[0.2em] text-apple-subtle font-semibold">Wetter in Duderstadt</div>
            <div id="weatherTemp" class="text-2xl font-bold mt-1">--°C</div>
          </div>
          <div id="weatherIcon" class="text-3xl" aria-label="Wetterzustand">☀️</div>
        </div>
        <div id="weatherMeta" class="mt-2 text-xs text-apple-subtle">Lädt...</div>
      </div>
    </div>

    <div class="mt-8 flex flex-wrap items-center gap-2 pt-4 border-t border-apple-borderLight dark:border-apple-borderDark">
      <button onclick="filterCategory('all')" class="cat-pill px-4 py-2 rounded-full text-xs font-medium transition bg-apple-blue text-white shadow-sm" data-cat="all">Alle Themen</button>
      <button onclick="filterCategory('politik')" class="cat-pill px-4 py-2 rounded-full text-xs font-medium transition bg-white dark:bg-[#1c1c1e] text-apple-subtle hover:text-[#1d1d1f] dark:hover:text-white border border-apple-borderLight dark:border-apple-borderDark">Politik</button>
      <button onclick="filterCategory('wirtschaft')" class="cat-pill px-4 py-2 rounded-full text-xs font-medium transition bg-white dark:bg-[#1c1c1e] text-apple-subtle hover:text-[#1d1d1f] dark:hover:text-white border border-apple-borderLight dark:border-apple-borderDark">Wirtschaft</button>
      <button onclick="filterCategory('technik')" class="cat-pill px-4 py-2 rounded-full text-xs font-medium transition bg-white dark:bg-[#1c1c1e] text-apple-subtle hover:text-[#1d1d1f] dark:hover:text-white border border-apple-borderLight dark:border-apple-borderDark">Technik</button>
      <button onclick="filterCategory('regional')" class="cat-pill px-4 py-2 rounded-full text-xs font-medium transition bg-white dark:bg-[#1c1c1e] text-apple-subtle hover:text-[#1d1d1f] dark:hover:text-white border border-apple-borderLight dark:border-apple-borderDark">Regional</button>
      <button onclick="filterCategory('events')" class="cat-pill px-4 py-2 rounded-full text-xs font-medium transition bg-white dark:bg-[#1c1c1e] text-apple-subtle hover:text-[#1d1d1f] dark:hover:text-white border border-apple-borderLight dark:border-apple-borderDark">Events</button>
    </div>
  </section>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 mt-6">
    <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <section id="eventsSection" class="mt-16 space-y-6">
      <div class="flex items-center space-x-3 pb-3 border-b border-apple-borderLight dark:border-apple-borderDark">
        <div class="w-8 h-8 rounded-xl bg-purple-500/10 text-purple-600 dark:text-purple-400 flex items-center justify-center font-bold text-sm">
          <i data-lucide="calendar" class="w-4 h-4"></i>
        </div>
        <div>
          <h2 class="text-2xl font-bold tracking-tight">Wochenend-Events: Duderstadt, Mingerode & Göttingen</h2>
          <p id="eventRange" class="text-xs text-apple-subtle">Termine für das aktuelle Wochenende</p>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="eventsGrid"></div>
    </section>
  </main>

  <div id="articleModal" class="fixed inset-0 z-50 hidden bg-black/60 apple-glass flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#1c1c1e] max-w-2xl w-full rounded-3xl overflow-hidden shadow-2xl border border-apple-borderLight dark:border-apple-borderDark flex flex-col max-h-[90vh]">
      <div class="relative h-64 w-full overflow-hidden bg-black/10">
        <img id="modalImg" src="" alt="" class="w-full h-full object-cover">
        <button onclick="closeModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-black/60 text-white flex items-center justify-center hover:bg-black transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
        <span id="modalBadge" class="absolute bottom-4 left-4 px-3 py-1 rounded-full text-xs font-semibold bg-white/90 text-black apple-glass"></span>
      </div>
      <div class="p-6 overflow-y-auto space-y-4">
        <div class="flex items-center justify-between text-xs text-apple-subtle font-mono">
          <span id="modalSource"></span>
          <span id="modalDate"></span>
        </div>
        <h2 id="modalTitle" class="text-2xl font-bold tracking-tight text-[#1d1d1f] dark:text-white"></h2>
        <div id="modalContent" class="text-base text-apple-subtle leading-relaxed space-y-3"></div>
        <div class="pt-4 border-t border-apple-borderLight dark:border-apple-borderDark flex items-center justify-between">
          <a id="modalLink" href="#" target="_blank" class="inline-flex items-center space-x-2 text-sm font-semibold text-apple-blue hover:text-apple-blueHover">
            <span>Originalquelle öffnen</span>
            <i data-lucide="external-link" class="w-4 h-4"></i>
          </a>
          <button onclick="closeModal()" class="px-5 py-2 rounded-full text-xs font-semibold bg-apple-bg dark:bg-black/40 hover:bg-black/10 transition">Schließen</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const NEWS_DATABASE = [
      { id: 1, cat: 'politik', badge: 'Top 1 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'Spanisches Zugunglück bei Toledo: Ermittler sichern Zugsicherung und Funkdaten', summary: 'Nach dem schweren Zugunglück in Spanien geht die Untersuchung weiter: Ermittler sichern Zugsicherung, Funkdaten und Gedächtnisse der beteiligten Leitstellen.', fullText: 'Die Ermittlungen konzentrieren sich auf die Zugsteuerung, die Signaltechnik und die Funkkommunikation zwischen Zugpersonal und Leitstelle. Die Behörden betonen, dass die Daten für die Rekonstruktion der letzten Minuten entscheidend sind. Experten prüfen zudem, ob technische Ausfälle, Menschliches Versagen oder organisatorische Mängel eine Rolle spielten. Die betroffenen Regionen erklärte die Verantwortung für die schnellere Einschätzung der Sicherheitslücken.', img: 'https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 2, cat: 'politik', badge: 'Top 2 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'Kabinett bringt „Gebäudetyp E“ auf den Weg: Günstigeres Bauen', summary: 'Die Bundesregierung will mit einem neuen Gebäudetyp für kleine und mittlere Projekte das Bauen deutlich vereinfachen und günstiger machen.', fullText: 'Der geplante Gebäudetyp E soll standardisierte Lösungen für energieeffiziente Wohn- und Verwaltungsgebäude ermöglichen. Ziel ist es, Planungs- und Baukosten zu senken, ohne die Sicherheit und Qualitätsstandards zu vernachlässigen. Der Entwurf wird als Baustein für mehr bezahlbaren Wohnraum verstanden. Kritiker warnen davor, das Regelwerk zu vereinfachen und so Qualitätskontrollen zu verwässern.', img: 'https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 3, cat: 'politik', badge: 'Top 3 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'Haushalt 2027: Chefhaushälter gehen in Klausur', summary: 'Vor der Bereinigungssitzung bleibt die Koalitionsdebatte über Steuern, Ausgaben und Prioritäten offen.', fullText: 'Die Chefhaushälter des Bundes wollen im Kreis der Fraktionen und Ministerien über offene Haushaltsreste sprechen. Dabei stehen insbesondere Verteidigung, Infrastruktur, soziale Sicherung und die langfristige Finanzierung der Klimawende im Fokus. Das Ziel ist eine tragfähige Struktur für den Entwurf 2027, obwohl parteiübergreifende Spannungen bestehen.', img: 'https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 4, cat: 'politik', badge: 'Top 4 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'Kanzlerreise: Halbleiter- und Rohstoffallianzen in Tokio und Seoul', summary: 'Die Reise zielt auf strategische Lieferketten, digitale Souveränität und robuste Wirtschaftsbeziehungen mit Asien.', fullText: 'Bundeskanzler und Wirtschaftsdelegation wollen in Tokio und Seoul mit Industrie- und Technologieunternehmen über kritische Rohstoffe und Halbleiterkooperationen sprechen. Die Gespräche sind Teil einer breiteren Strategie zur Reduktion von Abhängigkeiten. Die deutsche Seite wirbt zugleich für eine offene, regelbasierte Zusammenarbeit auf wissenschaftlicher und industrieller Ebene.', img: 'https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 5, cat: 'politik', badge: 'Top 5 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'Knesset-Wahlergebnis: Zersplitterung erschwert Koalitionsbildung', summary: 'Nach den Wahlen in Israel bleibt die politische Zukunft offen, weil keine Partei alleine regieren kann.', fullText: 'Die erdrutschartigen Ergebnisse verteilen die Mandate stark auf mehrere Blöcke. Die Koalitionsbildung dürfte daher schwieriger werden als in den vergangenen Wahlzyklen. Beobachter erwarten intensive Verhandlungen über Sicherheitspolitik, Reformen und außenpolitische Prioritäten. Die Lage bleibt volatil, da mehrere große Parteien mit unterschiedlichen Grundsatzentscheidungen auftreten.', img: 'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 6, cat: 'politik', badge: 'Top 6 Politik', date: '30.10.2026', source: 'NDR', title: 'Parteispendenaffäre: Rechtsausschuss fordert Konsequenzen', summary: 'Der niedersächsische Landtag fordert nach neuen Erkenntnissen schnelle Maßnahmen gegen mögliche Verfahrensfehler.', fullText: 'Im Rechtsausschuss wurde die AfD-Spendenaffäre erneut vertieft. Mitglieder fordern eine klare Verantwortung der politisch Verantwortlichen, soweit Transparenz- oder Meldepflichten verletzt wurden. Die Debatte beleuchtet zugleich die Frage, wie Spenden und Lobbykontakte in der Landespolitik kontrolliert werden.', img: 'https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1200&q=80', url: 'https://www.ndr.de/' },
      { id: 7, cat: 'politik', badge: 'Top 7 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'Maritime Sicherheitsoperation im Persischen Golf', summary: 'Begleitfregatten und Aufklärungsflüge sollen Schifffahrtswege und Öltransporte sichern.', fullText: 'Mehrere Staaten verlängern eine maritime Sicherheitsmission im Persischen Golf. Ziel ist die Sicherung wichtiger Schifffahrtsrouten gegen Attacken, Sabotage und Unruhen. Die Operation gilt als wichtiger Teil der regionalen Stabilität, auch wenn die politischen Spannungen weiter bestehen.', img: 'https://images.unsplash.com/photo-1578575437130-527eed3abbec?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 8, cat: 'politik', badge: 'Top 8 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'Ukraine-Winterhilfe: Europäische Hochspannungstransformatoren geliefert', summary: 'Mit der Lieferung wird die Energieversorgung der ukrainischen Infrastruktur vor dem Winter stabilisiert.', fullText: 'Europäische Partner liefern zusätzliche transformatorische Anlagen, die für die Stabilisierung des Stromnetzes notwendig sind. Die Versorgungsketten sind in der Krise eines der wichtigsten Themen, weil russische Angriffe auf die Stromversorgung weiter andauern. Die Maßnahmen werden als kurzfristige Stabilisierung und langfristiger Wiederaufbau begriffen.', img: 'https://images.unsplash.com/photo-1497435334941-8c899ee9e8e9?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 9, cat: 'politik', badge: 'Top 9 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'Innenminister fordern Fortführung stationärer Grenzkontrollen', summary: 'Bundesländer wollen die Grenzkontrollen bis zur Stabilisierung der Sicherheitslage weiterführen.', fullText: 'Die Innenminister der Länder fordern eine Verlängerung der stationären Grenzkontrollen, weil die Einreise und die Verhinderung illegaler Migration weiterhin hohe Priorität haben. Dabei betonen sie die Bedeutung gemeinsamer Verfahren, verlässlicher Datenlage und effizienterer Grenzkoordination. Die Debatte bleibt konfliktbeladen, weil einige Experten von einem geringeren Effekt sprechen.', img: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 10, cat: 'politik', badge: 'Top 10 Politik', date: '30.10.2026', source: 'Tagesschau', title: 'EU-Fahrgastrechte: Automatische Entschädigung bei Zugverspätungen', summary: 'Neue EU-Vorschriften könnten die automatische Entschädigung bei Zugverspätungen deutlich vereinfachen.', fullText: 'Die EU will die Entschädigungsregeln weiter harmonisieren, damit Fahrgäste bei Verspätungen nicht mehr über aufwendige Nachweise nachdenken müssen. Der Vorschlag soll auch die Verkehrssicherheit und die bessere Kooperation zwischen Anbietern und Bahnsystemen stärken. Kritiker sehen die finanzielle Last für Unternehmen als riskant an.', img: 'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 11, cat: 'wirtschaft', badge: 'Top 1 Wirtschaft', date: '30.10.2026', source: 'Tagesschau', title: 'ifo-Geschäftsklima steigt den sechsten Monat in Folge', summary: 'Das Barometer klettert erneut und bestätigt die Stabilisierung der deutschen Wirtschaft.', fullText: 'Das ifo-Geschäftsklima steigt zum sechsten Mal in Folge, was auf eine vereinfachte Belebung von Auftragseingängen und Investitionslust hindeutet. Die Unternehmen berichten von besserer Planungssicherheit, wenngleich die Energiekosten und Überkapazitäten weiterhin Sorgen bereiten. Ökonomen sehen ein positives Signal, aber keine verlässliche Erholung.', img: 'https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 12, cat: 'wirtschaft', badge: 'Top 2 Wirtschaft', date: '30.10.2026', source: 'Tagesschau', title: 'Industrie fordert Senkung der Stromsteuer für alle Betriebe', summary: 'Verbände verlangen verlässliche Reformen, um die Wettbewerbsfähigkeit im Mittelstand zu sichern.', fullText: 'Die industrielle Lobby verlangt eine echte Senkung der Stromsteuer, nicht nur eine zeitlich begrenzte Ausnahmeregelung. Die Industriebetriebe sehen massive Belastungen durch Energiepreise und möchten die Produktionsstandorte stärker absichern. Politik und Wirtschaft debattieren über mögliche Begleitmaßnahmen und langfristige Impact-Analysen.', img: 'https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 13, cat: 'wirtschaft', badge: 'Top 3 Wirtschaft', date: '30.10.2026', source: 'Tagesschau', title: 'Regionalisierungsmittel: Länder warnen vor ÖPNV-Kürzungen', summary: 'Verkehrsminister kritisieren mögliche Sparmaßnahmen im öffentlichen Nahverkehr.', fullText: 'Die Länder warnen vor gravierenden Einbußen beim Regionalisierungsmittel, die zu ÖPNV-Kürzungen und schlechterer Anbindung führen könnten. Die Debatte betrifft gerade jene Regionen, die auf verlässliche öffentliche Mobilität angewiesen sind. Die mögliche Wirkung auf Pendler, Tourismus und regionale Wirtschaft wird als hoch bewertet.', img: 'https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 14, cat: 'wirtschaft', badge: 'Top 4 Wirtschaft', date: '30.10.2026', source: 'Tagesschau', title: 'Automobilzulieferer beschleunigen Standortkonsolidierung', summary: 'Höhere Energiepreise und digitale Transformation zwingen Unternehmen zu Strukturänderungen.', fullText: 'Die größten Zulieferer des Automobilsektors kondensieren Produktions- und Logistikstandorte, um Kosten und Lieferkettenrisiken zu begrenzen. Die Transformation zu E-Mobilität erfordert massive Investitionen, die nur mit einer gezielten Standortstrategie tragfähig sind. Die Zahl der Beschäftigten in vielen Regionen bleibt dabei in der Schwebe.', img: 'https://images.unsplash.com/photo-1489515217757-5fd1be406fef?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 15, cat: 'wirtschaft', badge: 'Top 5 Wirtschaft', date: '30.10.2026', source: 'Tagesschau', title: 'Entscheidung über Briefporto ab 2027 vor dem Abschluss', summary: 'Bundesnetzagentur und Postbranche verhandeln über die nächste Preisrunde.', fullText: 'Die Debatte über das Briefporto ab 2027 nähert sich einem Abschluss, ohne die Frage des nachhaltigen Geschäftsmodells zu klären. Während die Post auf stabile Infrastruktur setzt, mahnen Verbraucherschützer eine faire und transparente Preisbildung an. Der nächste Schritt wird mit Blick auf Wettbewerbsfähigkeit und Nutzerfreundlichkeit analysiert.', img: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 16, cat: 'wirtschaft', badge: 'Top 6 Wirtschaft', date: '30.10.2026', source: 'Tagesschau', title: 'Bankensektor: Produktivitätsgewinne durch interne KI-Systeme', summary: 'Mehrere Banken nutzen interne KI-Lösungen, um Prozesse und Service zu verbessern.', fullText: 'Das Potenzial von KI im Bankensektor wird immer deutlicher. Unternehmen testen intelligente Support-Systeme, Risikobewertungen und Automatisierung in der Kreditabwicklung. Die Vorteile liegen in Geschwindigkeit und Effizienz, die Risiken aber in Recht, Transparenz und Datenschutz. Die Politik beobachtet die Entwicklungen mit besonderer Aufmerksamkeit.', img: 'https://images.unsplash.com/photo-1559526324-4b87b5e36e44?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 17, cat: 'wirtschaft', badge: 'Top 7 Wirtschaft', date: '30.10.2026', source: 'Tagesschau', title: 'Konsumklima: GfK erwartet preissensibles Weihnachtsgeschäft', summary: 'Die Verbraucher wollen eher sparsam kaufen und auf Qualität und Angebote achten.', fullText: 'Das Konsumklima bleibt ambivalent: Die Kauflaune ist leicht verbessert, aber die Preisreaktionen der Haushalte sind stärker als in früheren Jahren. Fachleute erwarten ein preissensibles Weihnachtsgeschäft, bei dem Bundles, Rabatte und Mehrwertangebote entscheidend werden. Einzelhändler bereiten sich darauf vor, mit Fokus auf echte Ersparnis und Komfort zu gewinnen.', img: 'https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 18, cat: 'wirtschaft', badge: 'Top 8 Wirtschaft', date: '30.10.2026', source: 'Tagesschau', title: 'Batterie-Garantierückstellungen belasten Autobauer-Quartalszahlen', summary: 'Vorsorgliche Rückstellungen für Garantien drücken die Bilanzwerte.', fullText: 'Autobauer verzeichnen nach der jüngsten Quartalsrunde höhere Aufwendungen für Batterie-Garantien und Regressansprüche. Die Kosten entstehen durch technische Änderungen, Reparaturzeiten und längere Lebenszyklen der Akkupakete. Das Thema wirft Fragen zur Qualitätssicherung und der wirtschaftlichen Belastbarkeit von E-Fahrzeugen auf.', img: 'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 19, cat: 'wirtschaft', badge: 'Top 9 Wirtschaft', date: '30.10.2026', source: 'Tagesschau', title: 'Rohstoffmärkte: Gold behauptet Rekordniveau nahe 2.740 Dollar', summary: 'Sicherheitsbedenken und Währungsunsicherheiten treiben bei Investoren die Nachfrage hoch.', fullText: 'Gold bleibt auf Rekordniveau und profitierte von einer Kombination aus geopolitischer Unsicherheit, niedrigeren Zinsannahmen und laufenden Währungsverschiebungen. Die Investoren sehen in Gold weiterhin einen wertvollen Hedge gegen wirtschaftliche Unsicherheiten. Analysten erwarten Volatilität, aber insgesamt eine stabile Nachfrage.', img: 'https://images.unsplash.com/photo-1610375461246-83df859d849d?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 20, cat: 'wirtschaft', badge: 'Top 10 Wirtschaft', date: '30.10.2026', source: 'Tagesschau', title: 'Forschungsförderung: Mittelstand mahnt verbindliche Antragsfristen an', summary: 'BVMW fordert mehr Planungssicherheit bei Forschungsprogrammen und Förderanträgen.', fullText: 'Der Mittelstand fordert verbindliche Fristen für Forschungs- und Innovationsprogramme, damit Unternehmen die Fördermittel für Investitionen und Produktentwicklung besser planen können. Die Kritik richtet sich gegen unklare Auswahl- und Bewilligungsfristen, die die Projekte unnötig verzögern. Die Förderung gilt als wichtig für Zukunftstechnologien und Arbeitsplätze.', img: 'https://images.unsplash.com/photo-1516321165247-4aa89a48be28?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 21, cat: 'technik', badge: 'Top 1 Technik', date: '30.10.2026', source: 'BSI', title: 'BSI erneuert Dringlichkeitswarnung vor Angriffen auf Web-Frameworks', summary: 'Automatisierte Angriffe betreffen weiterhin gängige Frameworks und skalieren mit Sicherheitslücken.', fullText: 'Das Bundesamt für Sicherheit in der Informationstechnik warnt erneut vor massiven Angriffen auf beliebte Web-Frameworks. Cyberkriminelle nutzen automatisierte Methoden, um Sicherheitslücken in unpatched Systemen auszuschöpfen. Die zuständige Stelle mahnt Betreiber zur schnellen Aktualisierung, zur Segmentierung von Netzwerken und zur Überprüfung von Firewall-Regeln an.', img: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80', url: 'https://www.bsi.bund.de/' },
      { id: 22, cat: 'technik', badge: 'Top 2 Technik', date: '30.10.2026', source: 'Tagesschau', title: 'Endlager Onkalo: Finnische Multibarrieren-Technologie setzt Maßstäbe', summary: 'Kupferkapseln, Tonschichten und Überwachungskonzepte gelten als Vorbild für sichere Langzeitlagerung.', fullText: 'Das finnische Endlagerprojekt Onkalo nutzt eine kombinierte Sicherheitsarchitektur aus Mulitbarrieren, geologischer Isolation und streng überwachten Einlagerungsprozessen. Die Technik wird als Vorbild in Europa und international diskutiert. Kritiker fordern jedoch eine noch stärkere gesellschaftliche Zustimmung und transparentere Rückholoptionen für Sicherheitsfragen.', img: 'https://images.unsplash.com/photo-1532635241-17e820acc59f?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },
      { id: 23, cat: 'technik', badge: 'Top 3 Technik', date: '30.10.2026', source: 'Tagesschau', title: 'Cybersicherheit bei vernetzten Fahrzeugen: API-Schutz im Zentrum', summary: 'Studien zeigen, dass ungeschützte Schnittstellen die größte Gefahr für vernetzte Autos sind.', fullText: 'Die Sicherheitsforschung zeigt erneut, dass offene APIs in Fahrzeugarchitekturen die größte Angriffswelle ermöglichen. Hersteller müssen daher robuste Zugriffskontrollen, Zero-Trust-Prinzipien und regelmäßige Sicherheitsprüfungen etabliert haben. Die Risiken betreffen nicht nur Fahrdaten, sondern auch Systemintegrität und Verkehrssicherheit.', img: 'https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },

      { id: 25, cat: 'technik', badge: 'Top 5 Technik', date: '30.10.2026', source: 'Tagesschau', title: 'Prüfverbände warnen vor Firmware-Tuning bei E-Bikes und Scootern', summary: 'TÜV und Verbände warnen vor technischen Eingriffen, die Sicherheitsrisiken erhöhen.', fullText: 'Prüfverbände berichten von verstärkten Firmware-Tuning-Maßnahmen bei E-Bikes und E-Scootern. Diese Änderungen können die Akkuleistung, Wachstums- oder Bremsfunktionen künstlich beeinflussen und die fahrzeugtechnische Sicherheit gefährden. Die Meldung wird als dringende Warnung an Hersteller, Händler und Nutzer verstanden.', img: 'https://images.unsplash.com/photo-1558980664-10e7170b5df9?auto=format&fit=crop&w=1200&q=80', url: 'https://www.tagesschau.de/' },

    function formatDayDate(date = new Date()) {
      return new Intl.DateTimeFormat('de-DE', {
        weekday: 'long',

        month: 'long',
        year: 'numeric'
      }).format(date);
    }

    function formatDateTime(date = new Date()) {
      return `${new Intl.DateTimeFormat('de-DE', {
        weekday: 'long'
      }).format(date)}, ${new Intl.DateTimeFormat('de-DE', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      }).format(date)} • ${new Intl.DateTimeFormat('de-DE', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(date)} Uhr`;
    }

    function getWeatherIcon(code) {
      const map = {
        0: '☀️', 1: '⛅', 2: '⛅', 3: '☁️', 45: '🌫️', 48: '🌫️',
        51: '🌦️', 53: '🌦️', 55: '🌦️', 56: '🌧️', 57: '🌧️',
        61: '🌧️', 63: '🌧️', 65: '🌧️', 66: '🌧️', 67: '🌧️',
        71: '❄️', 73: '❄️', 75: '❄️', 77: '❄️', 80: '🌦️', 81: '🌧️', 82: '🌧️',
        85: '❄️', 86: '❄️', 95: '⛈️', 96: '⛈️', 99: '⛈️'
      };
      return map[code] || '☀️';
    }

    async function loadWeather() {
      const tempEl = document.getElementById('weatherTemp');
      const metaEl = document.getElementById('weatherMeta');
      const iconEl = document.getElementById('weatherIcon');
      if (!tempEl || !metaEl || !iconEl) return;

      try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=51.5124&longitude=9.6724&current=temperature_2m,weather_code,wind_speed_10m&timezone=Europe%2FBerlin';
        const response = await fetch(url);
        if (!response.ok) throw new Error('Weather request failed');
        const data = await response.json();
        const current = data.current;
        const temp = Math.round(current.temperature_2m);
        const wind = Math.round(current.wind_speed_10m);
        const code = current.weather_code;

        tempEl.textContent = `${temp}°C`;
        iconEl.textContent = getWeatherIcon(code);
        metaEl.textContent = `Wind ${wind} km/h • ${new Intl.DateTimeFormat('de-DE', { hour: '2-digit', minute: '2-digit' }).format(new Date())}`;
      } catch (error) {
        tempEl.textContent = '--°C';
        iconEl.textContent = '☁️';
        metaEl.textContent = 'Wetterdaten aktuell nicht verfügbar';
      }
    }

    function updateEventRangeText() {
      const eventRange = document.getElementById('eventRange');
      if (!eventRange) return;
      const today = new Date();
      const weekday = today.getDay();
      const daysUntilSaturday = (6 - weekday + 7) % 7 || 7;
      const saturday = new Date(today);
      saturday.setDate(today.getDate() + daysUntilSaturday);
      const sunday = new Date(saturday);
      sunday.setDate(saturday.getDate() + 1);
      const formatter = new Intl.DateTimeFormat('de-DE', { day: '2-digit', month: '2-digit' });
      eventRange.textContent = `Termine vom ${formatter.format(saturday)} bis ${formatter.format(sunday)}`;
    }

    function filterCategory(cat) {
      currentFilter = cat;

    function getNaturalGermanVoice() {
      const voices = window.speechSynthesis.getVoices();
      const preferredNames = [
        'Google Deutsch',
        'Microsoft Hedda',
        'Hedda',
        'Anna',
        'Samantha',
        'Google UK English Female',
        'Microsoft Stefan'
      ];

      const matching = voices.filter(voice => {
        const v = voice.name.toLowerCase();
        const lang = voice.lang.toLowerCase();
        return /de|deutsch|german/.test(lang) || preferredNames.some(name => v.includes(name.toLowerCase()));
      });

      const direct = preferredNames
        .map(name => matching.find(voice => voice.name.toLowerCase().includes(name.toLowerCase())))
        .find(Boolean);

      return direct || matching[0] || voices[0] || null;
    }

    let isSpeaking = false;
    function toggleSpeech() {
      const ttsIcon = document.getElementById('ttsIcon');
      if (!('speechSynthesis' in window)) {
        alert('Sprachausgabe wird nicht unterstützt.');
        return;
      }
      if (isSpeaking) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
        ttsIcon.setAttribute('data-lucide', 'volume-2');
        lucide.createIcons();
        return;
      }
      const textToRead = 'Tägliche Zusammenfassung des heutigen Tages für Familie Gödecke. Top Meldungen: Spanisches Zugunglück bei Toledo, Kabinett verabschiedet Gebäudetyp E, ifo-Geschäftsklima steigt, mehr. Wirtschaft: Konsumklima, Goldpreis, und Forschung. Technik: BSI warnt vor Angriffen auf Web-Frameworks und KI in der Fertigung. Regional: Stabsübergabe in Duderstadt und Veranstaltungen im Eichsfeld. Wetter in Duderstadt: heute mit wechselhaftem Herbstwetter und milden Temperaturen.';
      const utterance = new SpeechSynthesisUtterance(textToRead);
      utterance.lang = 'de-DE';
      utterance.rate = 0.82;
      utterance.pitch = 1.1;
      utterance.volume = 1;

      const preferredVoice = getNaturalGermanVoice();
      if (preferredVoice) {
        utterance.voice = preferredVoice;
      }

      utterance.onend = () => {
        isSpeaking = false;
        ttsIcon.setAttribute('data-lucide', 'volume-2');
        lucide.createIcons();
      };

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
      isSpeaking = true;
      ttsIcon.setAttribute('data-lucide', 'square');
      lucide.createIcons();
    }
