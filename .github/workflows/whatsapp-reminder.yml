name: Tägliche WhatsApp-Zusammenfassung

on:
  schedule:
    - cron: '30 12 * * *'
    - cron: '15 20 * * *'
  workflow_dispatch:

jobs:
  send-whatsapp:
    runs-on: ubuntu-latest

    steps:
      - name: WhatsApp Nachricht senden
        env:
          GREEN_API_INSTANCE_ID: "710722785849"
          GREEN_API_TOKEN: "1dfb83b441fa456fae20f912c20cd562a51393b3fb284335ab"
          PHONE: "491704131865"
          URL: "https://salkin180.github.io/agent-nachrichten-goedecke/"
        run: |
          TODAY=$(date '+%A, %d. %B %Y')
          HOUR=$(date '+%H')
          MINUTE=$(date '+%M')

          if [ "$HOUR:$MINUTE" = "20:15" ]; then
            GREETING="Guten Abend!"
          else
            GREETING="Guten Morgen!"
          fi

          MESSAGE=$(cat <<EOF
          tägliche Zusammenfassung des heutigen Tages

          ${GREETING} Hier ist dein interaktives Nachrichten-Briefing für ${TODAY}:

          🏛️ Politik: Zugunglück bei Toledo | Gebäudetyp E beschlossen | Kanzlerreise Asien
          📈 Wirtschaft: ifo-Geschäftsklima klettert | Stromsteuerdebatte | Nahverkehrsfinanzierung
          💻 Technik: BSI-Warnung vor Web-Exploits | Endlager Onkalo | Connected-Car-APIs
          📍 Region: Amtswechsel im Stadthaus Duderstadt | Sanierungsreihe Fachwerk5Eck | Halloween Mingerode

          Vollständiges Magazin mit allen Details & Events:
          ${URL}
          EOF
          )

          export MESSAGE
          python3 - <<'PY'
          import json, os, urllib.request

          instance = os.environ["GREEN_API_INSTANCE_ID"]
          token = os.environ["GREEN_API_TOKEN"]
          phone = os.environ["PHONE"]
          message = os.environ["MESSAGE"]

          url = f"https://api.green-api.com/waInstance{instance}/SendMessage/{token}"

          payload = json.dumps({
              "chatId": f"{phone}@c.us",
              "message": message
          }).encode("utf-8")

          req = urllib.request.Request(
              url,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              print(response.read().decode("utf-8"))
          PY
